<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symptly — Instagram Carousel Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --ss-accent: #00C49A;
    --ss-accent-light: #33DFBB;
    --ss-accent-dark: #009977;
    --ss-violet: #7C5CFC;
    --ss-violet-light: #9B82FA;
    --ss-bg: #FAF9F6;
    --ss-surface: #FFFFFF;
    --ss-surface2: #F4F3F0;
    --ss-surface3: #E9E7E2;
    --ss-text1: #1C2534;
    --ss-text2: #4A5568;
    --ss-text3: #8896AB;
    --ss-separator: #E6E3DD;
    --ss-success: #22C55E;
    --ss-warning: #F59E0B;
    --ss-error: #EF4444;
    --ss-info: #3B82F6;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F0EFEC;
    color: var(--ss-text1);
  }

  /* ─── TOP BAR ─── */
  .top-bar {
    background: var(--ss-surface);
    border-bottom: 1px solid var(--ss-separator);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar h1 {
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .logo-dot {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, var(--ss-accent), var(--ss-violet));
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 13px;
  }

  /* ─── NAV TABS ─── */
  .carousel-nav {
    display: flex; gap: 8px; padding: 16px 28px;
    overflow-x: auto; background: var(--ss-surface);
    border-bottom: 1px solid var(--ss-separator);
  }
  .carousel-tab {
    padding: 9px 18px; border-radius: 100px;
    border: 1.5px solid var(--ss-separator); background: var(--ss-surface);
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--ss-text2); cursor: pointer; white-space: nowrap;
    transition: all 0.2s;
  }
  .carousel-tab:hover { border-color: var(--ss-accent); color: var(--ss-accent); }
  .carousel-tab.active { background: var(--ss-accent); border-color: var(--ss-accent); color: white; }

  /* ─── MAIN ─── */
  .main-area { max-width: 1500px; margin: 0 auto; padding: 28px; }
  .controls-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .carousel-title-display { font-size: 20px; font-weight: 800; }
  .carousel-subtitle { font-size: 12px; color: var(--ss-text3); margin-top: 2px; }

  .btn {
    font-family: inherit; font-weight: 600; font-size: 13px;
    border: none; border-radius: 10px; padding: 9px 18px;
    cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--ss-accent); color: white; }
  .btn-primary:hover { background: var(--ss-accent-dark); }
  .btn-secondary { background: var(--ss-surface); color: var(--ss-text1); border: 1.5px solid var(--ss-separator); }
  .btn-secondary:hover { border-color: var(--ss-accent); }
  .btn-violet { background: var(--ss-violet); color: white; }
  .btn-group { display: flex; gap: 8px; }

  /* ─── SLIDE STRIP ─── */
  .slide-strip {
    display: flex; gap: 18px; overflow-x: auto; padding-bottom: 16px;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
  }
  .slide-strip::-webkit-scrollbar { height: 5px; }
  .slide-strip::-webkit-scrollbar-track { background: var(--ss-surface2); border-radius: 3px; }
  .slide-strip::-webkit-scrollbar-thumb { background: var(--ss-accent); border-radius: 3px; }

  .slide-wrapper { flex-shrink: 0; scroll-snap-align: start; position: relative; }
  .slide-label {
    font-size: 10px; font-weight: 700; color: var(--ss-text3);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; text-align: center;
  }

  .ig-slide {
    width: 360px; height: 450px; border-radius: 12px; overflow: hidden;
    position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  .ig-slide:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.11); }

  .slide-canvas {
    width: 1080px; height: 1350px;
    transform: scale(0.3333); transform-origin: top left;
    position: relative; overflow: hidden;
  }

  /* ═══════════════════════════════════════════════════════
     SLIDE TYPES — Clean, Light, High-Converting
     ═══════════════════════════════════════════════════════ */

  /* ── HOOK SLIDES (1, 2, 3) — Each standalone entry point ── */
  .slide-hook {
    background: var(--ss-bg);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 90px 80px; text-align: center;
    width: 1080px; height: 1350px;
    position: relative;
  }
  .slide-hook .hook-eyebrow {
    font-size: 26px; font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase; color: var(--ss-accent);
    margin-bottom: 32px;
  }
  .slide-hook .hook-headline {
    font-size: 76px; font-weight: 900; line-height: 1.08;
    color: var(--ss-text1); letter-spacing: -2.5px; max-width: 920px;
  }
  .slide-hook .hook-headline .acc { color: var(--ss-accent); }
  .slide-hook .hook-headline .vio { color: var(--ss-violet); }
  .slide-hook .hook-headline .err { color: var(--ss-error); }
  .slide-hook .hook-sub {
    font-size: 34px; font-weight: 500; color: var(--ss-text3);
    margin-top: 36px; line-height: 1.45; max-width: 800px;
  }
  .slide-hook .hook-swipe {
    position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
    font-size: 24px; font-weight: 600; color: var(--ss-text3);
    display: flex; align-items: center; gap: 8px;
    opacity: 0.7;
  }
  .slide-hook .hook-swipe .arrow { font-size: 28px; color: var(--ss-accent); }

  /* Visual accent blobs for hooks */
  .slide-hook .blob-tl {
    position: absolute; top: -80px; left: -80px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(0,196,154,0.07) 0%, transparent 70%);
    border-radius: 50%;
  }
  .slide-hook .blob-br {
    position: absolute; bottom: -80px; right: -80px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(124,92,252,0.05) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* ── NARRATIVE SLIDES (4-8) — Problem + solution arc ── */
  .slide-narrative {
    background: var(--ss-bg);
    display: flex; flex-direction: column;
    padding: 80px; justify-content: center;
    width: 1080px; height: 1350px;
    position: relative;
  }
  .slide-narrative .narr-eyebrow {
    font-size: 24px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 28px;
  }
  .slide-narrative .narr-eyebrow.teal { color: var(--ss-accent); }
  .slide-narrative .narr-eyebrow.red { color: var(--ss-error); }
  .slide-narrative .narr-eyebrow.violet { color: var(--ss-violet); }
  .slide-narrative .narr-title {
    font-size: 62px; font-weight: 800; line-height: 1.12;
    color: var(--ss-text1); letter-spacing: -1.5px; margin-bottom: 32px;
    max-width: 920px;
  }
  .slide-narrative .narr-title .acc { color: var(--ss-accent); }
  .slide-narrative .narr-title .err { color: var(--ss-error); }
  .slide-narrative .narr-title .vio { color: var(--ss-violet); }
  .slide-narrative .narr-body {
    font-size: 35px; line-height: 1.55; color: var(--ss-text2); max-width: 900px;
  }
  .slide-narrative .narr-body strong { color: var(--ss-text1); font-weight: 700; }

  /* Cliffhanger at bottom of narrative slides */
  .slide-narrative .cliffhanger {
    position: absolute; bottom: 56px; left: 80px; right: 80px;
    padding: 28px 36px;
    background: var(--ss-surface);
    border-radius: 16px;
    border: 2px solid var(--ss-separator);
    font-size: 30px; font-weight: 600; color: var(--ss-text2);
    display: flex; align-items: center; justify-content: space-between;
  }
  .slide-narrative .cliffhanger .cliff-arrow {
    font-size: 32px; color: var(--ss-accent); font-weight: 800;
  }

  /* Bullet points for narrative */
  .narr-bullets { margin-top: 36px; }
  .narr-bullets .bullet {
    display: flex; align-items: flex-start; gap: 20px;
    margin-bottom: 28px; font-size: 33px; color: var(--ss-text2); line-height: 1.4;
  }
  .narr-bullets .bullet .b-dot {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-top: 2px;
  }
  .narr-bullets .bullet .b-dot.red { background: rgba(239,68,68,0.08); color: var(--ss-error); }
  .narr-bullets .bullet .b-dot.teal { background: rgba(0,196,154,0.08); color: var(--ss-accent); }
  .narr-bullets .bullet .b-dot.violet { background: rgba(124,92,252,0.08); color: var(--ss-violet); }

  /* Stat callout box */
  .narr-stat {
    margin-top: 44px; padding: 32px 36px;
    background: var(--ss-surface); border-radius: 16px;
    border-left: 6px solid var(--ss-error);
    display: flex; align-items: center; gap: 24px;
  }
  .narr-stat .stat-num { font-size: 54px; font-weight: 900; color: var(--ss-error); }
  .narr-stat .stat-text { font-size: 29px; color: var(--ss-text2); line-height: 1.35; }

  /* ── PIVOT SLIDE — Teal gradient turn ── */
  .slide-pivot {
    background: linear-gradient(155deg, var(--ss-accent) 0%, #009977 100%);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 90px; text-align: center;
    width: 1080px; height: 1350px;
  }
  .slide-pivot .pivot-headline {
    font-size: 70px; font-weight: 900; color: white;
    line-height: 1.12; letter-spacing: -2px; max-width: 900px;
  }
  .slide-pivot .pivot-sub {
    font-size: 34px; font-weight: 500;
    color: rgba(255,255,255,0.8); margin-top: 36px;
    line-height: 1.45; max-width: 780px;
  }

  /* ── NEED SLIDE (second to last) — "Here's what you need" ── */
  .slide-need {
    background: var(--ss-bg);
    display: flex; flex-direction: column;
    padding: 80px; justify-content: center;
    width: 1080px; height: 1350px;
  }
  .slide-need .need-eyebrow {
    font-size: 24px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: var(--ss-violet);
    margin-bottom: 28px;
  }
  .slide-need .need-title {
    font-size: 58px; font-weight: 800; line-height: 1.12;
    color: var(--ss-text1); letter-spacing: -1.5px; margin-bottom: 44px;
  }
  .slide-need .need-title .acc { color: var(--ss-accent); }
  .need-features { display: flex; flex-direction: column; gap: 24px; }
  .need-feat {
    display: flex; align-items: center; gap: 24px;
    padding: 28px 32px;
    background: var(--ss-surface); border-radius: 16px;
    border: 1.5px solid var(--ss-separator);
  }
  .need-feat .nf-icon {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; flex-shrink: 0;
  }
  .need-feat .nf-icon.teal { background: rgba(0,196,154,0.1); }
  .need-feat .nf-icon.violet { background: rgba(124,92,252,0.1); }
  .need-feat .nf-icon.blue { background: rgba(59,130,246,0.1); }
  .need-feat .nf-icon.green { background: rgba(34,197,94,0.1); }
  .need-feat .nf-text { font-size: 30px; color: var(--ss-text2); line-height: 1.35; }
  .need-feat .nf-text strong { color: var(--ss-text1); font-weight: 700; }

  /* ── CTA SLIDE (last) — Calm, clean, logo-forward ── */
  .slide-cta {
    background: var(--ss-bg);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 80px; text-align: center;
    width: 1080px; height: 1350px;
    position: relative;
  }
  .slide-cta .cta-logo {
    width: 200px; height: 200px;
    margin-bottom: 48px;
    position: relative;
  }
  /* SVG logo rendered inline — 3D leaf approximation */
  .slide-cta .cta-logo svg { width: 100%; height: 100%; }

  .slide-cta .cta-topline {
    font-size: 30px; font-weight: 600; color: var(--ss-text3);
    margin-bottom: 16px;
  }
  .slide-cta .cta-appname {
    font-size: 80px; font-weight: 900; color: var(--ss-text1);
    letter-spacing: -2px; margin-bottom: 20px;
  }
  .slide-cta .cta-appname .acc { color: var(--ss-accent); }
  .slide-cta .cta-tagline {
    font-size: 34px; font-weight: 500; color: var(--ss-text2);
    line-height: 1.45; max-width: 800px; margin-bottom: 48px;
  }
  .slide-cta .cta-pill {
    padding: 24px 56px;
    background: var(--ss-accent);
    border-radius: 100px;
    font-size: 32px; font-weight: 700; color: white;
    margin-bottom: 28px;
  }
  .slide-cta .cta-free {
    font-size: 26px; color: var(--ss-text3); font-weight: 500;
    margin-bottom: 44px;
  }
  .slide-cta .cta-badges {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  }
  .slide-cta .cta-badge {
    padding: 14px 24px; background: var(--ss-surface);
    border: 1.5px solid var(--ss-separator); border-radius: 100px;
    font-size: 22px; font-weight: 600; color: var(--ss-text2);
    display: flex; align-items: center; gap: 8px;
  }

  /* ─── PROGRESS DOTS ─── */
  .slide-dots {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
  }
  .slide-dots .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--ss-separator);
  }
  .slide-dots .dot.active {
    background: var(--ss-accent); width: 32px; border-radius: 5px;
  }

  /* ─── DOWNLOAD OVERLAY ─── */
  .download-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(28,37,52,0.6); backdrop-filter: blur(8px);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .download-overlay.active { display: flex; }
  .download-modal {
    background: var(--ss-surface); border-radius: 22px;
    padding: 40px; max-width: 460px; width: 90%; text-align: center;
  }
  .download-modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .download-modal p { font-size: 13px; color: var(--ss-text3); margin-bottom: 20px; }
  .download-progress {
    width: 100%; height: 6px; background: var(--ss-surface2);
    border-radius: 3px; overflow: hidden; margin-bottom: 12px;
  }
  .download-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--ss-accent), var(--ss-violet));
    border-radius: 3px; transition: width 0.3s; width: 0%;
  }
  .download-status { font-size: 12px; color: var(--ss-text2); font-weight: 500; }

  /* ─── JSON PANEL ─── */
  .json-panel {
    margin-top: 36px; background: var(--ss-surface);
    border-radius: 18px; overflow: hidden; border: 1px solid var(--ss-separator);
  }
  .json-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--ss-separator);
    background: var(--ss-surface2);
  }
  .json-panel-header h3 { font-size: 13px; font-weight: 700; }
  .json-editor {
    width: 100%; min-height: 400px; padding: 18px; border: none;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11.5px; line-height: 1.6; color: var(--ss-text1);
    background: var(--ss-surface); resize: vertical; outline: none;
  }

  @media (max-width: 768px) {
    .main-area { padding: 14px; }
    .ig-slide { width: 300px; height: 375px; }
    .slide-canvas { transform: scale(0.2778); }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1><span class="logo-dot">S</span> Symptly Carousel Studio</h1>
  <div class="btn-group">
    <button class="btn btn-secondary" onclick="toggleJSON()">{ } JSON</button>
    <button class="btn btn-primary" onclick="downloadAll()">⬇ Download All Slides</button>
  </div>
</div>

<div class="carousel-nav" id="carouselNav"></div>

<div class="main-area">
  <div class="controls-row">
    <div>
      <div class="carousel-title-display" id="carouselTitleDisplay"></div>
      <div class="carousel-subtitle" id="carouselSubDisplay"></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="downloadAll()">⬇ Download All</button>
      <button class="btn btn-violet" onclick="downloadCurrentSlide()">⬇ Current Slide</button>
    </div>
  </div>
  <div class="slide-strip" id="slideStrip"></div>
  <div class="json-panel" id="jsonPanel" style="display:none;">
    <div class="json-panel-header">
      <h3>Carousel JSON</h3>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="resetJSON()">Reset</button>
        <button class="btn btn-primary" onclick="applyJSON()">Apply</button>
      </div>
    </div>
    <textarea class="json-editor" id="jsonEditor" spellcheck="false"></textarea>
  </div>
</div>

<div class="download-overlay" id="downloadOverlay">
  <div class="download-modal">
    <h3>Exporting slides...</h3>
    <p>Rendering at 1080 × 1350px for Instagram</p>
    <div class="download-progress"><div class="download-progress-bar" id="downloadProgressBar"></div></div>
    <div class="download-status" id="downloadStatus">Preparing...</div>
  </div>
</div>

<div id="renderArea" style="position:fixed;left:-9999px;top:0;z-index:-1;"></div>

<script>
// ═══════════════════════════════════════════════════════════
// SYMPTLY LOGO SVG — Approximation of 3D leaf icon
// ═══════════════════════════════════════════════════════════
const SYMPTLY_LOGO_SVG = `
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#33DFBB"/>
      <stop offset="100%" style="stop-color:#00C49A"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00C49A"/>
      <stop offset="100%" style="stop-color:#009977"/>
    </linearGradient>
    <linearGradient id="leaf3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#33DFBB"/>
      <stop offset="100%" style="stop-color:#009977"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00C49A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Top leaf -->
  <path d="M100 30 Q130 50 120 85 Q105 95 100 80 Q95 95 80 85 Q70 50 100 30Z" fill="url(#leaf1)" filter="url(#shadow1)"/>
  <!-- Bottom-left leaf -->
  <path d="M60 95 Q40 115 55 145 Q70 150 75 135 Q72 152 88 148 Q105 125 60 95Z" fill="url(#leaf2)" filter="url(#shadow1)"/>
  <!-- Bottom-right leaf -->
  <path d="M140 95 Q160 115 145 145 Q130 150 125 135 Q128 152 112 148 Q95 125 140 95Z" fill="url(#leaf3)" filter="url(#shadow1)"/>
  <!-- Center connection -->
  <circle cx="100" cy="100" r="8" fill="#009977" opacity="0.6"/>
  <!-- Top arc accent -->
  <path d="M118 42 Q135 30 142 48" stroke="#009977" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Violet orbs -->
  <circle cx="52" cy="72" r="10" fill="#7C5CFC" opacity="0.85"/>
  <circle cx="155" cy="155" r="8" fill="#9B82FA" opacity="0.75"/>
  <!-- Small teal dot -->
  <circle cx="140" cy="55" r="5" fill="#33DFBB" opacity="0.6"/>
</svg>`;


// ═══════════════════════════════════════════════════════════
// CAROUSEL DATA — Triple Hook Framework
// ═══════════════════════════════════════════════════════════
// Structure per carousel:
//   Slide 1: HOOK 1 — Bold, stops cold scroller
//   Slide 2: HOOK 2 — Standalone hook, different angle
//   Slide 3: HOOK 3 — Third entry point, also standalone
//   Slides 4-7: Narrative arc with cliffhangers (incomplete info)
//   Slide 8: Pivot — "but here's the thing..."
//   Slide 9: NEED — "what you actually need"
//   Slide 10: CTA — Calm, logo, "try this free app"
// ═══════════════════════════════════════════════════════════

const CAROUSELS = [

// ─────────── 1. SLEEP & FATIGUE ───────────
{
  id: "sleep-fatigue",
  title: "Sleep & Fatigue",
  subtitle: "Triple-hook carousel — 10 slides — 1080×1350",
  slides: [
    {
      type: "hook",
      eyebrow: "",
      headline: "You slept 8 hours and woke up <span class='acc'>exhausted</span>",
      sub: "It's not about how much you sleep.",
      swipe: "swipe →"
    },
    {
      type: "hook",
      eyebrow: "",
      headline: "<span class='err'>73%</span> of people with chronic fatigue get told \"just sleep more\"",
      sub: "That advice is making it worse. Here's why.",
      swipe: "swipe →"

// ═══════════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════════

let currentCarouselIdx = 0;
let currentSlideIdx = 0;

function init() {
  renderNav();
  selectCarousel(0);
}

function renderNav() {
  const nav = document.getElementById('carouselNav');
  nav.innerHTML = CAROUSELS.map((c, i) =>
    `<button class="carousel-tab ${i === currentCarouselIdx ? 'active' : ''}" onclick="selectCarousel(${i})">${c.title}</button>`
  ).join('');
}

function selectCarousel(idx) {
  currentCarouselIdx = idx;
  currentSlideIdx = 0;
  renderNav();
  const c = CAROUSELS[idx];
  document.getElementById('carouselTitleDisplay').textContent = c.title;
  document.getElementById('carouselSubDisplay').textContent = c.subtitle + '  ·  ' + c.slides.length + ' slides';
  renderSlides(c);
  updateJSONEditor();
}

function renderSlides(carousel) {
  const strip = document.getElementById('slideStrip');
  const labels = ['HOOK 1', 'HOOK 2', 'HOOK 3'];
  strip.innerHTML = carousel.slides.map((slide, i) => {
    let label = i < 3 ? labels[i] : `Slide ${i + 1} · ${slide.type}`;
    if (slide.type === 'need') label = 'THE NEED';
    if (slide.type === 'cta') label = 'CTA';
    if (slide.type === 'pivot') label = 'PIVOT';
    return `<div class="slide-wrapper" onclick="currentSlideIdx=${i}">
      <div class="slide-label">${label}</div>
      <div class="ig-slide">
        <div class="slide-canvas">${renderSlideHTML(slide, i, carousel.slides.length)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderSlideHTML(slide, idx, total) {
  const dots = renderDots(idx, total);

  switch(slide.type) {

    case 'hook': return `
      <div class="slide-hook">
        <div class="blob-tl"></div>
        <div class="blob-br"></div>
        ${slide.eyebrow ? `<div class="hook-eyebrow">${slide.eyebrow}</div>` : ''}
        <div class="hook-headline">${slide.headline}</div>
        <div class="hook-sub">${slide.sub}</div>
        ${slide.swipe ? `<div class="hook-swipe">${slide.swipe} <span class="arrow">→</span></div>` : ''}
        ${dots}
      </div>`;

    case 'narrative': return `
      <div class="slide-narrative">
        <div class="narr-eyebrow ${slide.eyebrowColor}">${slide.eyebrow}</div>
        <div class="narr-title">${slide.title}</div>
        <div class="narr-body">${slide.body}</div>
        ${slide.stat ? `
          <div class="narr-stat">
            <div class="stat-num">${slide.stat.num}</div>
            <div class="stat-text">${slide.stat.text}</div>
          </div>` : ''}
        ${slide.bullets ? `
          <div class="narr-bullets">
            ${slide.bullets.map(b => `
              <div class="bullet">
                <div class="b-dot ${b.color}">${b.icon}</div>
                <div>${b.text}</div>
              </div>`).join('')}
          </div>` : ''}
        ${slide.cliffhanger ? `
          <div class="cliffhanger">
            <span>${slide.cliffhanger}</span>
            <span class="cliff-arrow">→</span>
          </div>` : ''}
        ${dots}
      </div>`;

    case 'pivot': return `
      <div class="slide-pivot">
        <div class="pivot-headline">${slide.headline}</div>
        <div class="pivot-sub">${slide.sub}</div>
        ${dots}
      </div>`;

    case 'need': return `
      <div class="slide-need">
        <div class="need-eyebrow">${slide.eyebrow}</div>
        <div class="need-title">${slide.title}</div>
        <div class="need-features">
          ${slide.features.map(f => `
            <div class="need-feat">
              <div class="nf-icon ${f.iconColor}">${f.icon}</div>
              <div class="nf-text"><strong>${f.title}</strong> ${f.text}</div>
            </div>`).join('')}
        </div>
        ${dots}
      </div>`;

    case 'cta': return `
      <div class="slide-cta">
        <div class="cta-logo">${SYMPTLY_LOGO_SVG}</div>
        <div class="cta-topline">${slide.topline}</div>
        <div class="cta-appname">${slide.appname}</div>
        <div class="cta-tagline">${slide.tagline}</div>
        <div class="cta-pill">${slide.buttonText}</div>
        <div class="cta-free">${slide.freeNote}</div>
        <div class="cta-badges">
          ${slide.badges.map(b => `<div class="cta-badge">${b}</div>`).join('')}
        </div>
        ${dots}
      </div>`;

    default: return `<div style="width:1080px;height:1350px;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-size:36px;">Unknown: ${slide.type}</div>`;
  }
}

function renderDots(activeIdx, total) {
  let d = '<div class="slide-dots">';
  for (let i = 0; i < total; i++) d += `<div class="dot ${i === activeIdx ? 'active' : ''}"></div>`;
  return d + '</div>';
}


// ═══════════════════════════════════════════════════════════
// DOWNLOAD ENGINE
// ═══════════════════════════════════════════════════════════

async function downloadAll() {
  const carousel = CAROUSELS[currentCarouselIdx];
  const overlay = document.getElementById('downloadOverlay');
  const bar = document.getElementById('downloadProgressBar');
  const status = document.getElementById('downloadStatus');
  overlay.classList.add('active');
  bar.style.width = '0%';
  const area = document.getElementById('renderArea');

  for (let i = 0; i < carousel.slides.length; i++) {
    status.textContent = `Rendering slide ${i+1} of ${carousel.slides.length}...`;
    bar.style.width = `${((i+1)/carousel.slides.length)*100}%`;

    const c = document.createElement('div');
    c.style.cssText = 'width:1080px;height:1350px;position:absolute;left:0;top:0;';
    c.innerHTML = renderSlideHTML(carousel.slides[i], i, carousel.slides.length);
    area.appendChild(c);
    await new Promise(r => setTimeout(r, 150));

    try {
      const canvas = await html2canvas(c, { width:1080, height:1350, scale:1, useCORS:true, backgroundColor:null, logging:false });
      const link = document.createElement('a');
      link.download = `${carousel.id}_slide_${String(i+1).padStart(2,'0')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch(e) { console.error('Render error slide', i+1, e); }
    area.removeChild(c);
    await new Promise(r => setTimeout(r, 350));
  }
  status.textContent = `Done! ${carousel.slides.length} slides exported.`;
  setTimeout(() => overlay.classList.remove('active'), 1500);
}

async function downloadCurrentSlide() {
  const carousel = CAROUSELS[currentCarouselIdx];
  const slide = carousel.slides[currentSlideIdx];
  const area = document.getElementById('renderArea');
  const c = document.createElement('div');
  c.style.cssText = 'width:1080px;height:1350px;position:absolute;left:0;top:0;';
  c.innerHTML = renderSlideHTML(slide, currentSlideIdx, carousel.slides.length);
  area.appendChild(c);
  await new Promise(r => setTimeout(r, 150));
  try {
    const canvas = await html2canvas(c, { width:1080, height:1350, scale:1, useCORS:true, backgroundColor:null, logging:false });
    const link = document.createElement('a');
    link.download = `${carousel.id}_slide_${String(currentSlideIdx+1).padStart(2,'0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) { console.error('Render error', e); }
  area.removeChild(c);
}

// JSON EDITOR
// ═══════════════════════════════════════════════════════════

let jsonOpen = false;
function toggleJSON() {
  jsonOpen = !jsonOpen;
  document.getElementById('jsonPanel').style.display = jsonOpen ? 'block' : 'none';
  if (jsonOpen) updateJSONEditor();
}
function updateJSONEditor() {
  document.getElementById('jsonEditor').value = JSON.stringify(CAROUSELS[currentCarouselIdx], null, 2);
}
function applyJSON() {
  try {
    CAROUSELS[currentCarouselIdx] = JSON.parse(document.getElementById('jsonEditor').value);
    selectCarousel(currentCarouselIdx);
  } catch(e) { alert('JSON error: ' + e.message); }
}
function resetJSON() { updateJSONEditor(); }

init();
</script>
